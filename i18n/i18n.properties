#XFRM: Tutorial guiado (onboarding)
onboardingTitle=Tutorial do Expense Manager
onboardingCloseButton=Fechar
onboardingFinishButton=Concluir tutorial
onboardingStep1Title=Boas-vindas
onboardingStep1Text=Bem-vindo! O Expense Manager organiza as despesas de cada pessoa em cart\u00f5es, faturas e d\u00edvidas. O caminho \u00e9 simples: crie a pessoa, cadastre um cart\u00e3o, crie as categorias, lance os gastos e acompanhe as faturas. Este tutorial mostra cada passo \u2014 use os bot\u00f5es "Avan\u00e7ar" e "Voltar".
onboardingStep2Title=Criar a pessoa
onboardingStep2Text=A pessoa \u00e9 a dona dos dados financeiros (sal\u00e1rio, meta de gastos, cart\u00f5es, faturas e d\u00edvidas). Comece criando uma pessoa com nome, moeda e, se quiser, receita e meta mensais.
onboardingStep2Action=Criar pessoa agora
onboardingStep3Title=Adicionar um cart\u00e3o
onboardingStep3Text=Cadastre cada cart\u00e3o com o limite e a moeda. O campo Fechamento \u00e9 o dia em que a fatura "vira" e o Vencimento \u00e9 o dia de pagar; \u00e9 esse ciclo que define em qual fatura cada gasto entra.
onboardingGoToCards=Ir para Cart\u00f5es
onboardingStep4Title=Adicionar uma categoria
onboardingStep4Text=As categorias agrupam os gastos (mercado, transporte, lazer...) e alimentam os gr\u00e1ficos da vis\u00e3o geral. Crie as que voc\u00ea usa no dia a dia.
onboardingGoToCategories=Ir para Categorias
onboardingStep5Title=Adicionar um gasto
onboardingStep5Text=Lance um gasto com descri\u00e7\u00e3o, valor, data, quantidade de parcelas, cart\u00e3o e categoria. O valor pode ser dividido em parcelas mensais e o lan\u00e7amento entra automaticamente na fatura correta do cart\u00e3o.
onboardingStep5Action=Adicionar gasto agora
onboardingStep6Title=Gasto fixo
onboardingStep6Text=Ao marcar "Gasto fixo", o lan\u00e7amento \u00e9 replicado automaticamente todos os meses, do m\u00eas da compra at\u00e9 dezembro do mesmo ano. Na virada do ano, lance novamente para continuar a s\u00e9rie.
onboardingStep7Title=Regra do fechamento
onboardingStep7Text=Aten\u00e7\u00e3o a esta regra: se a data do gasto for igual ou posterior ao dia de fechamento do cart\u00e3o, o gasto entra na fatura do m\u00eas seguinte; se for antes, entra na fatura do m\u00eas atual. Exemplo: um cart\u00e3o com fechamento no dia 3 e uma compra no dia 5 caem na fatura do m\u00eas que vem.
onboardingStep8Title=Acompanhar o gasto (fatura)
onboardingStep8Text=Na aba Faturas voc\u00ea escolhe o cart\u00e3o e o m\u00eas/ano para ver cada lan\u00e7amento, o total e o quanto j\u00e1 foi pago ou fechado no per\u00edodo.
onboardingGoToInvoices=Ir para Faturas
onboardingStep9Title=Enviar fatura completa
onboardingStep9Text=Na Vis\u00e3o geral existe o bot\u00e3o "Enviar fatura completa": ele re\u00fane as faturas do m\u00eas, as d\u00edvidas e um resumo consolidado em um e-mail com PDFs anexados. Use-o quando quiser enviar o resumo por e-mail para a pessoa.
onboardingGoToOverview=Ir para Vis\u00e3o geral
onboardingStep10Title=Aviso por e-mail
onboardingStep10Text=Al\u00e9m do envio manual, o app verifica de tempos em tempos as faturas ainda n\u00e3o enviadas e envia o aviso por e-mail automaticamente (com os PDFs por cart\u00e3o, por d\u00edvida e o consolidado). Na lista de faturas, o \u00edcone de envelope mostra se a fatura j\u00e1 foi enviada ou n\u00e3o.
onboardingStep11Title=Adicionar uma d\u00edvida
onboardingStep11Text=D\u00edvidas s\u00e3o valores parcelados fora do cart\u00e3o (empr\u00e9stimos, financiamentos, acordos). Cadastre o nome, o valor total e o dia de vencimento mensal para acompanhar quanto ainda falta.
onboardingGoToDebts=Ir para D\u00edvidas
onboardingStep12Title=Lan\u00e7ar uma movimenta\u00e7\u00e3o
onboardingStep12Text=Dentro de cada d\u00edvida voc\u00ea lan\u00e7a movimenta\u00e7\u00f5es: as do tipo IN s\u00e3o pagamentos (reduzem o saldo devedor) e as do tipo OUT s\u00e3o acr\u00e9scimos (juros, novos valores). O saldo e a barra de progresso se atualizam a cada lan\u00e7amento.
onboardingStep13Title=Backup dos seus dados
onboardingStep13Text=Fazer backup \u00e9 a sua garantia: use "Exportar backup" para baixar um arquivo .zip com todos os dados e "Restaurar backup" para import\u00e1-lo (em outro dispositivo, ap\u00f3s reinstalar ou para recuperar algo). Guarde o arquivo em um lugar seguro.
onboardingStep13Action=Abrir backup
onboardingStep14Title=Tudo pronto!
onboardingStep14Text=Voc\u00ea conheceu o fluxo completo do Expense Manager. Se quiser rever este tutorial depois, toque no \u00edcone de ajuda (?) no topo da tela ou no bot\u00e3o de tutorial na tela inicial.
tutorialFinishedToast=Tutorial conclu\u00eddo. Bom uso!
tutorialOpenButton=Ver tutorial
tutorialRerunButton=Refazer tutorial
tutorialHeaderButton=Abrir o tutorial
